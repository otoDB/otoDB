[mcp_servers.storybook]
url = "http://localhost:6006/mcp"

[mcp_servers.playwright]
command = "bunx"
args = [
  "@playwright/mcp@latest",
  "--headless",
  "--isolated",
  "--browser",
  "chromium",
  "--viewport-size",
  "1280x720",
  "--output-dir",
  ".playwright-mcp",
]

[mcp_servers.chrome-devtools]
command = "bunx"
args = [
  "chrome-devtools-mcp@latest",
  "--headless=true",
  "--isolated=true",
]
