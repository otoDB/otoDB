name: CI for Backend

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

defaults:
  run:
    working-directory: backend
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uvx ruff format --check
      - run: uvx ruff check

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.database.name }})
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    needs:
      - migrations
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        database:
          - { name: PostgreSQL 17, version: "17" }
          # - { type: postgresql, name: PostgreSQL 18, version: "18" }

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      OTODB_SECRET_KEY: test-secret-key-for-ci
      OTODB_DB_HOST: postgres
      OTODB_DB_PORT: 5432
      OTODB_DB_NAME: "otodb_test"
      OTODB_DB_USER: postgres
      OTODB_DB_PASSWORD: postgres

    services:
      postgres:
        image: ${{ format('postgres:{0}', matrix.database.version) }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: otodb_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: uv sync
      - name: Copy .env.example to .env
        run: cp .env.example .env
      - name: Run tests with pytest
        run: uv run pytest -v --tb=short
      - name: Check server can start
        timeout-minutes: 1
        run: |
          uv run manage.py migrate
          timeout 10 uv run granian --interface asgi gateway:application || code=$?
          if [[ ${code:-0} -ne 124 && ${code:-0} -ne 0 ]]; then exit $code; fi

  migrations:
    name: Check for missing migrations
    runs-on: ubuntu-latest
    env:
      OTODB_SECRET_KEY: dummy
      OTODB_SKIP_DB: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: uv sync
      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

  build_docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - migrations
    permissions:
      packages: write
    env:
      REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
        with:
          driver: ${{ github.server_url == 'https://github.com' && 'docker-container' || 'docker' }}
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USERNAME || github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN || github.token }}
      - uses: docker/metadata-action@v6
        id: backend-metadata
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/otodb-backend
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=ref,event=tag
          flavor: |
            latest=true
      - name: ${{ github.ref == 'refs/heads/master' && 'Build and publish image' || 'Only build image' }}
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.ref == 'refs/heads/master' }}
          context: backend
          file: backend/Dockerfile
          tags: ${{ steps.backend-metadata.outputs.tags }}
          labels: ${{ steps.backend-metadata.outputs.labels }}
          platforms: linux/amd64
          cache-from: ${{ github.server_url == 'https://github.com' && 'type=gha,scope=backend' || '' }}
          cache-to: ${{ github.server_url == 'https://github.com' && 'type=gha,scope=backend,mode=max' || '' }}
          build-args: |
            OTODB_HASH=${{ github.sha }}

  openapi-typespec:
    name: Verify openapi.json is fresh
    runs-on: ubuntu-latest
    env:
      OTODB_SECRET_KEY: dummy
      OTODB_SKIP_DB: 1
    needs:
      - lint
      - test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: uv sync
      - name: Regenerate openapi.json and check for diff
        run: |
          uv run manage.py openapi_schema > openapi.json
          git diff --exit-code openapi.json
