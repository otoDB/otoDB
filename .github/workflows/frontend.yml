name: CI for Frontend

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - 'backend/openapi.json'

defaults:
  run:
    working-directory: frontend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: bunx oxfmt --check .
      - run: bunx eslint .

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - name: Generate schema.ts
        run: bun run sync-schema
      - name: Compile Paraglide project
        run: bunx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      - name: Copy dotenv file to generate type-safe environment variables
        run: cp .env.example .env
      - run: bun run check
      - run: bun run test

  test_storybook:
    name: Test Storybook
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - name: Generate schema.ts
        run: bun run sync-schema
      - name: Compile Paraglide project
        run: bunx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      - name: Copy dotenv file to generate type-safe environment variables
        run: cp .env.example .env
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - run: bun run test-storybook

  deploy_storybook:
    name: Deploy Storybook to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - name: Generate schema.ts
        run: bun run sync-schema
      - name: Compile Paraglide project
        run: bunx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      - name: Copy dotenv file to generate type-safe environment variables
        run: cp .env.example .env
      - run: bun run build-storybook
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          preCommands: |
            wrangler pages project create otodb-storybook --production-branch=master || true
          command: pages deploy storybook-static --project-name=otodb-storybook --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: storybook-preview
          message: |
            ## Storybook Preview

            | | |
            |---|---|
            | **Status** | Deploy successful |
            | **Preview URL** | ${{ steps.deploy.outputs.deployment-url }} |
            | **Branch Preview URL** | ${{ steps.deploy.outputs.pages-deployment-alias-url }} |

  build_docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - test_storybook
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v6
        id: frontend-metadata
        with:
          images: ghcr.io/otodb/otodb-frontend
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=ref,event=tag
          flavor: |
            latest=true
      - name: ${{ github.ref == 'refs/heads/master' && 'Build and publish image' || 'Only build image' }}
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.ref == 'refs/heads/master' }}
          context: frontend
          file: frontend/Dockerfile
          build-contexts: |
            backend=backend
          tags: ${{ steps.frontend-metadata.outputs.tags }}
          labels: ${{ steps.frontend-metadata.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/otodb/otodb-frontend:buildcache
          cache-to: type=registry,ref=ghcr.io/otodb/otodb-frontend:buildcache,mode=max
          build-args: |
            OTODB_HASH=${{ github.sha }}
