name: CI for Storybook

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/storybook.yml'

defaults:
  run:
    working-directory: frontend
    shell: bash

jobs:
  test_storybook:
    name: Test Storybook
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Generate schema.ts
        run: bun run sync-schema
      - name: Compile Paraglide project
        run: bunx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      - name: Copy dotenv file to generate type-safe environment variables
        run: cp .env.example .env
      - name: Generate MSW worker script
        run: bunx msw init static --save
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - run: bun run test-storybook

  deploy_storybook:
    name: Deploy Storybook to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    if: >-
      vars.DEPLOY_STORYBOOK != 'false' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Generate schema.ts
        run: bun run sync-schema
      - name: Compile Paraglide project
        run: bunx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      - name: Copy dotenv file to generate type-safe environment variables
        run: cp .env.example .env
      - name: Generate MSW worker script
        run: bunx msw init static --save
      - run: bun run build-storybook
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          bunx wrangler@4 pages project create otodb-storybook --production-branch=master || true
          bunx wrangler@4 pages deploy storybook-static --project-name=otodb-storybook --commit-dirty=true --branch="$BRANCH"
          jq -r 'select(.type == "pages-deploy-detailed") | "url=\(.url)"' "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
      - name: Link preview from commit status
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl -fsS -X POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"context\": \"Storybook preview\", \"state\": \"success\", \"description\": \"Deployed to Cloudflare Pages\", \"target_url\": \"$PREVIEW_URL\"}"
