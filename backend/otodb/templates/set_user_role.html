{% extends "base.html" %}
{% block page_title %}Set User Role{% endblock page_title %}

{% block content %}
<section>
    <h1>Set User Role</h1>
    {% if message %}
    <p><strong>{{ message }}</strong></p>
    {% endif %}
    <form target="_self" method="post">
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
      <input type="submit"/>
    </form>
</section>
{% endblock content %}
