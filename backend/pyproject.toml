[project]
name = "otodb"
version = "0.1.0"
description = "otoDB is a community-driven website consisting of a collaborative user-managed database and wiki."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "litestar[pydantic,sqlalchemy]>=2.24.0",
    "fast-diff-match-patch>=2.1.0",
    "django-comments-xtd>=2.10.11",
    "django-cors-headers>=4.9.0",
    "django>=6.0.6",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "django-ninja>=1.6.2",
    "requests>=2.34.2",
    "django-ordered-model>=3.7.4",
    "granian>=2.7.5",
    "psycopg[binary,pool]>=3.3.4",
    "nh3>=0.3.5",
    "furl>=2.1.4",
    "django-cte>=3.0.0",
    "boto3>=1.43.24",
    "django-dirtyfields>=1.9.9",
    "django-request-cache>=1.5.0",
    "django-tagulous>=2.1.1",
    "sentry-sdk[django]>=2.61.1",
    "orjson>=3.11.9",
    "django-vcache>=2.1.1",
    "lark>=1.3.1",
    # has corresponding patch in patches/
    "yt-dlp[default]==2026.6.9",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
    "I",    # imports
    "W",    # whitespace
    "B007", # loop variable
]
ignore = [
    "W191", # tabs
    "RUF012", # Django class attrs
    "B008",   # Django Ninja Query()/File()
]
unfixable = [
    "B007",
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "N999", # naming
    "PLE2502", # special characters testing
    "PLE2515", # ditto
]
"otodb/api/**" = [
    "UP037", # quoted-annotation
    "UP045", # Optional['X'] -> 'X' | None is a runtime TypeError
    "UP007", # ditto for Union['X', Y]
]

[dependency-groups]
dev = [
    "django-silk>=5.5.0",
    "granian[reload]>=2.7.5",
    # granian's auto loop picks this on Windows.
    # ProactorEventLoop can't run psycopg async. (Litestar DB endpoints)
    "winloop>=0.6.3; sys_platform == 'win32'",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "pytest-asyncio>=1.4.0",
]
